name: 'Auto label by title'
on:
  pull_request:
    types: [opened, edited]
    branches: [ "main" ]

permissions: {}

jobs:
  label:
    permissions:
      pull-requests: write  # to add a label to the PR
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/auto-label.yml@249b6cfa8fd90b7b58fcaab643e75f9e6cb078dc # v8.16.0
