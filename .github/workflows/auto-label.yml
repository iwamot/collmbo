name: 'Auto label by title'
on:
  pull_request:
    types: [opened, edited]
    branches: [ "main" ]

permissions: {}

jobs:
  label:
    permissions:
      pull-requests: write  # to add a label to the PR
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/auto-label.yml@a180a0bcae83bb6eede088999024bc2e3862c16c # v8.22.0
