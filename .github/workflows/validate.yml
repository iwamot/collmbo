name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [ "main" ]
  # Daily, so a new advisory against the locked dependencies fails the audit
  # even when nothing else changes.
  schedule:
    - cron: '0 6 * * *'
      timezone: Asia/Tokyo
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    permissions:
      contents: read
      id-token: write  # for Codecov OIDC upload
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/validate-with-coverage.yml@e30904fbba60ee0a2dde540df2403a90e59e3a5e # v8.17.0
