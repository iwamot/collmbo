name: 'Dependency review'
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependency-review:
    permissions:
      contents: read
      pull-requests: write  # to comment review summary
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dependency-review.yml@e30904fbba60ee0a2dde540df2403a90e59e3a5e # v8.17.0
