name: Dependabot auto-merge
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependabot-auto-merge:
    permissions:
      contents: write       # to merge auto-merge PRs
      pull-requests: write  # to enable auto-merge
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dependabot-auto-merge.yml@18f741c4161171e7c415075f9feb31f3a0f992d4 # v8.20.1
