name: Dependabot auto-merge
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependabot-auto-merge:
    permissions:
      contents: write       # to merge auto-merge PRs
      pull-requests: write  # to enable auto-merge
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dependabot-auto-merge.yml@151b1bf39e0c30c80800f35de3f5aadbd859bae5 # v8.14.1
