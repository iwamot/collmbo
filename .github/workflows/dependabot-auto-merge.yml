name: Dependabot auto-merge
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependabot-auto-merge:
    permissions:
      contents: write       # to merge auto-merge PRs
      pull-requests: write  # to enable auto-merge
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dependabot-auto-merge.yml@e30904fbba60ee0a2dde540df2403a90e59e3a5e # v8.17.0
