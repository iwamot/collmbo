name: Dependabot auto-merge
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependabot-auto-merge:
    permissions:
      contents: write       # to merge auto-merge PRs
      pull-requests: write  # to enable auto-merge
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dependabot-auto-merge.yml@a404711ccc7d69582489ad7712f416ab9941ce3c # v8.21.0
