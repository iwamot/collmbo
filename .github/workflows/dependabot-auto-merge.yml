name: Dependabot auto-merge
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dependabot-auto-merge:
    permissions:
      contents: write       # to merge auto-merge PRs
      pull-requests: write  # to enable auto-merge
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dependabot-auto-merge.yml@249b6cfa8fd90b7b58fcaab643e75f9e6cb078dc # v8.16.0
