name: DCO
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dco:
    permissions:
      pull-requests: read  # to read PR commits for DCO sign-off check
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dco.yml@e5473d794269314bf1ef838dacfcc505c2cb239f # v8.14.0
