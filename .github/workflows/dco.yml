name: DCO
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dco:
    permissions:
      pull-requests: read  # to read PR commits for DCO sign-off check
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dco.yml@7b091fa5fb18e6dc84145fa54fd45ff94e139cd0 # v8.18.0
