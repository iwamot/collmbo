name: DCO
on:
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  dco:
    permissions:
      pull-requests: read  # to read PR commits for DCO sign-off check
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: iwamot/workflows/.github/workflows/dco.yml@b393f83d1bb294145aa8670ec24fe6c39906bc67 # v8.23.1
