name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
        type: string

permissions: {}

jobs:
  release:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: false
    uses: iwamot/workflows/.github/workflows/release-ghcr.yml@96c2e27a41f5c3de4d90d9b8776a1c5aae453812 # v8.18.1
    with:
      tag: ${{ inputs.tag || '' }}
    permissions:
      checks: read  # allow the shared release workflow to inspect required CI
      statuses: read  # allow inspection of required legacy commit statuses
      contents: write  # to draft and publish the GitHub Release
      packages: write  # to push images to GHCR
      id-token: write  # to mint OIDC tokens for cosign and attest
      attestations: write  # to write the provenance attestation
      artifact-metadata: write  # to record artifact metadata for the attestation
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
